[workspace]
members = ["crates/core", "crates/daemon", "crates/ctl"]
resolver = "2"

[workspace.package]
version = "0.5.1"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
evdev = "0.13.2"
notify = "8.2"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
